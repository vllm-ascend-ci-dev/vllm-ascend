# TEST-ONLY: low-cost validation for PR #16718 review fixes.
name: PR16718 review validation

on:
  workflow_dispatch:
  push:
    branches:
      - test/pr16718-review-fix

permissions:
  contents: read

concurrency:
  group: pr16718-review-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check -v
          pytest regex types-regex mypy PyYAML

      - name: Run cache-engine tests
        run: >-
          python -m pytest -q
          --confcutdir=tests/ut/_tools
          tests/ut/_tools/test_build_cache.py
          tests/ut/_tools/test_build_cache_concurrency.py

      - name: Run targeted mypy
        run: >-
          python -m mypy
          tests/ut/_tools/build_cache_test_utils.py
          tests/ut/_tools/test_build_cache.py

      - name: Parse production workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path

          import yaml

          paths = sorted(Path('.github').glob('**/*.yaml'))
          paths += sorted(Path('.github').glob('**/*.yml'))
          for path in paths:
              with path.open(encoding='utf-8') as stream:
                  yaml.safe_load(stream)
          print(f'parsed {len(paths)} YAML files')
          PY

      - name: Check credential-less cache coordinator contract
        run: |
          python - <<'PY'
          from pathlib import Path

          import yaml

          path = Path('.github/workflows/_ensure_csrc_cache.yaml')
          workflow = yaml.safe_load(path.read_text(encoding='utf-8'))
          prepare = workflow['jobs']['prepare-cache-checks']
          build = workflow['jobs']['build-missing-caches']

          assert prepare['outputs']['has_write_credentials'] == (
              '$' + '{{ steps.writer-credentials.outputs.present }}'
          )
          detector = next(
              step
              for step in prepare['steps']
              if step.get('id') == 'writer-credentials'
          )
          assert detector['env'] == {
              'HW_OBS_AK': '$' + '{{ secrets.HW_OBS_AK }}',
              'HW_OBS_SK': '$' + '{{ secrets.HW_OBS_SK }}',
          }
          condition = build['if']
          assert "has_missing == 'true'" in condition
          assert "has_write_credentials == 'true'" in condition
          print('credential-less coordinator remains lookup-only')
          PY

      - name: Check patch whitespace
        run: git diff --check HEAD~2..HEAD
