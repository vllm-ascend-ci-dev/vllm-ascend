name: TEST-ONLY CPU L0 handoff

on:
  workflow_dispatch:
    inputs:
      target_id:
        type: choice
        options: [a3-arm64-ubuntu, 310p-arm64-ubuntu]
        default: a3-arm64-ubuntu
        required: true
      with_test_obs_writer:
        type: boolean
        default: false
        required: true

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ascend-csrc-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      csrc_hash: ${{ steps.hash.outputs.csrc_hash }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Resolve all cache targets
        id: targets
        env:
          TARGET_ID: ${{ inputs.target_id }}
        run: |
          python3 .github/workflows/scripts/resolve_csrc_cache_targets.py \
            --target-ids "[\"${TARGET_ID}\"]"

      - name: Calculate csrc hash
        id: hash
        run: |
          # Fail closed: without pipefail, a git failure can be hidden by the
          # pipeline and produce sha256(empty) as a valid-looking cache key.
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          # Limit invalidation to tracked inputs that can change csrc artifacts.
          CSRC_MANIFEST=$(git ls-files -s -- csrc setup.py CMakeLists.txt cmake)
          if [ -z "$CSRC_MANIFEST" ]; then
            echo "::error::No tracked csrc inputs found."
            exit 1
          fi

          CSRC_HASH=$(printf '%s\n' "$CSRC_MANIFEST" | sha256sum | awk '{print $1}')
          echo "csrc_hash=$CSRC_HASH" >> "$GITHUB_OUTPUT"

  build-cache:
    needs: prepare-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare-targets.outputs.targets) }}
    uses: ./.github/workflows/_build_csrc_cache.yaml
    secrets:
      HW_OBS_AK: ${{ inputs.with_test_obs_writer && secrets.OBS_ACCESS_KEY || '' }}
      HW_OBS_SK: ${{ inputs.with_test_obs_writer && secrets.OBS_SECRET_KEY || '' }}
    with:
      target: ${{ toJSON(matrix.target) }}
      csrc_hash: ${{ needs.prepare-targets.outputs.csrc_hash }}
      source_ref: ${{ github.sha }}

  verify-same-run-l0:
    needs: [prepare-targets, build-cache]
    runs-on: ubuntu-latest
    steps:
      - name: Download CPU-produced L0
        uses: actions/download-artifact@v4
        with:
          name: csrc-l0-${{ inputs.target_id }}-${{ needs.prepare-targets.outputs.csrc_hash }}
          path: ${{ runner.temp }}/csrc-l0

      - name: Verify and unpack complete L0
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/csrc-l0"
          sha256sum --check csrc-l0.tar.sha256
          tar -tf csrc-l0.tar | sed -n '1,20p'
          mkdir -p "$RUNNER_TEMP/csrc-l0-unpacked"
          tar -xf csrc-l0.tar -C "$RUNNER_TEMP/csrc-l0-unpacked"
          test -d "$RUNNER_TEMP/csrc-l0-unpacked/vllm_ascend/_cann_ops_custom"
          find "$RUNNER_TEMP/csrc-l0-unpacked/vllm_ascend" \
            -maxdepth 1 -type f -name '*.so' -print -quit | grep -q .
          echo "Same-run CPU L0 artifact is complete and checksum-verified"
