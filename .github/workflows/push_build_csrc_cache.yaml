name: Cache csrc Build Artifacts

on:
  workflow_dispatch:
    inputs:
      runner_override:
        description: 'Optional build runner override; empty uses the production target runner.'
        type: string
        required: false
        default: ''

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ascend-csrc-build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-targets:
    # Test-only coordinator. It only resolves JSON and computes the csrc hash.
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.validation-target.outputs.targets }}
      csrc_hash: ${{ steps.validation-hash.outputs.csrc_hash }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Resolve production A2 target
        id: target
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/resolve_csrc_cache_targets.py \
            --target-ids '["a2-arm64-ubuntu"]'

      - name: Calculate production csrc hash
        id: hash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          CSRC_MANIFEST=$(git ls-files -s -- csrc setup.py CMakeLists.txt cmake)
          if [ -z "$CSRC_MANIFEST" ]; then
            echo "::error::No tracked csrc inputs found."
            exit 1
          fi

          CSRC_HASH=$(printf '%s\n' "$CSRC_MANIFEST" | sha256sum | awk '{print $1}')
          echo "csrc_hash=$CSRC_HASH" >> "$GITHUB_OUTPUT"

      - name: Build isolated validation target
        id: validation-target
        env:
          TARGETS: ${{ steps.target.outputs.targets }}
          RUNNER_OVERRIDE: ${{ inputs.runner_override }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          targets = json.loads(os.environ["TARGETS"])
          if len(targets) != 1:
              raise SystemExit(f"expected one target, got {len(targets)}")

          target = targets[0]
          production_runner = target["runner"]
          override = os.environ["RUNNER_OVERRIDE"].strip()

          # Always isolate the validation L1 namespace from production.
          target["id"] = target["id"] + "-validation"

          if override:
              target["runner"] = override

          print(f"production runner={production_runner}")
          print(f"effective runner={target['runner']}")
          print(f"validation target id={target['id']}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(
                  "targets=" + json.dumps(targets, separators=(",", ":")),
                  file=out,
              )
          PY

      - name: Isolate validation L0 key
        id: validation-hash
        env:
          CSRC_HASH: ${{ steps.hash.outputs.csrc_hash }}
        run: |
          set -euo pipefail
          echo "csrc_hash=${CSRC_HASH}-validation" >> "$GITHUB_OUTPUT"

  build-cache:
    needs: prepare-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare-targets.outputs.targets) }}

    # Exact production reusable workflow from the parent ci-build commit.
    uses: ./.github/workflows/_build_csrc_cache.yaml
    with:
      target: ${{ toJSON(matrix.target) }}
      csrc_hash: ${{ needs.prepare-targets.outputs.csrc_hash }}
      source_ref: ${{ github.sha }}
