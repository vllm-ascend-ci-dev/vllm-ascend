#
# TEST-ONLY workflow for vllm-ascend-ci-dev/vllm-ascend.
#
# The filename intentionally matches a workflow present on the fork default
# branch, allowing workflow_dispatch with --ref test/all-workflow-incremental-cache.
#
# NEVER merge this validation harness verbatim into upstream.
#
name: Validate persistent incremental csrc cache

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Validation scenario
        required: true
        type: choice
        default: static
        options:
          - static
          - producer
          - source
          - selective-a3
          - doctest-source
          - doctest-diagnose
          - doctest-root-diff
          - wheel-a2
          - image-a2
      target_id:
        description: Producer target ID
        required: false
        type: string
        default: a2-arm64-ubuntu
      device:
        description: Device for direct source validation
        required: false
        type: choice
        default: a2
        options:
          - a2
          - a3
          - 310p
          - a5
      runner_override:
        description: Optional CI-fork runner override
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: incremental-cache-validation-${{ github.ref }}-${{ inputs.scenario }}-${{ inputs.target_id }}-${{ inputs.device }}
  cancel-in-progress: true

jobs:
  static:
    if: ${{ inputs.scenario == 'static' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate integration markers
        run: |
          set -euo pipefail
          test -f .github/actions/csrc-l1-restore/action.yaml
          test -f .github/actions/csrc-l1-save/action.yaml
          test -x .github/workflows/scripts/export_csrc_l1_from_image.sh

          python3 - <<'PY'
          import json
          from pathlib import Path

          targets = json.loads(
              Path(".github/workflows/scripts/csrc_cache_targets.json")
              .read_text(encoding="utf-8")
          )
          required_targets = {
              "a2-arm64-ubuntu",
              "a3-arm64-ubuntu",
              "310p-arm64-ubuntu",
              "a5-arm64-ubuntu",
          }
          assert required_targets <= set(targets)
          assert all(
              target.get("incremental_cache") is True
              for target in targets.values()
          )

          ensure = Path(
              ".github/workflows/_ensure_csrc_cache.yaml"
          ).read_text(encoding="utf-8")
          assert "lookup-a5" in ensure

          markers = {
              ".github/workflows/_selected_tests.yaml": "fallback-l1",
              ".github/workflows/schedule_e2e_upstream_test.yaml":
                  "fallback-l1",
              ".github/workflows/schedule_main2main.yaml": "main2main-l1",
              ".github/workflows/_e2e_nightly_single_node.yaml":
                  "source-l1",
              ".github/workflows/_e2e_nightly_single_node_560t.yaml":
                  "source-l1",
              ".github/workflows/_e2e_nightly_single_node_models.yaml":
                  "source-l1",
              ".github/workflows/schedule_doctest.yaml": "doctest-l1",
              ".github/workflows/schedule_release_code_and_wheel.yml":
                  "wheel-l1",
              ".github/workflows/_schedule_image_build.yaml": "image-l1",
              "tests/e2e/nightly/multi_node/scripts/run.sh":
                  "VLLM_ASCEND_BUILD_CACHE_DIR",
          }
          for name, marker in markers.items():
              text = Path(name).read_text(encoding="utf-8")
              assert marker in text, (name, marker)
          PY

      - name: Set up Python for cache-engine tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run cache-engine unit tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest regex
          timeout 300s python -m pytest -q \
            --confcutdir=tests/ut/_tools \
            tests/ut/_tools/test_build_cache.py \
            tests/ut/_tools/test_build_cache_concurrency.py

  prepare-producer:
    if: ${{ inputs.scenario == 'producer' }}
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      csrc_hash: ${{ steps.hash.outputs.csrc_hash }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve production target with CI runner override
        id: resolve
        env:
          TARGET_ID: ${{ inputs.target_id }}
          RUNNER_OVERRIDE: ${{ inputs.runner_override }}
        run: |
          set -euo pipefail
          env -u GITHUB_OUTPUT \
            python3 .github/workflows/scripts/resolve_csrc_cache_targets.py \
            --target-ids "[\"${TARGET_ID}\"]" > /tmp/targets.out

          TARGETS="$(sed -n 's/^targets=//p' /tmp/targets.out)"
          python3 - "$TARGETS" "$RUNNER_OVERRIDE" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          target = json.loads(sys.argv[1])[0]
          explicit = sys.argv[2].strip()
          runner_by_device = {
              "a2": "linux-aarch64-a2-2",
              "a3": "linux-aarch64-a3-2",
              "310p": "linux-aarch64-310p-2",
              "a5": "linux-aarch64-a5-2",
          }
          if explicit:
              target["runner"] = explicit
          else:
              target["runner"] = runner_by_device[target["device"]]

          # Isolate both persistent L1 namespace and final L0 validation key.
          target["id"] = target["id"] + "-ci-validation"
          print("target=" + json.dumps(target, separators=(",", ":")))
          PY

      - name: Calculate isolated csrc hash
        id: hash
        run: |
          set -euo pipefail
          manifest="$(git ls-files -s -- csrc setup.py CMakeLists.txt cmake)"
          test -n "$manifest"
          digest="$(printf '%s\n' "$manifest" | sha256sum | awk '{print $1}')"
          echo "csrc_hash=${digest}-ci-validation" >> "$GITHUB_OUTPUT"

  producer:
    if: ${{ inputs.scenario == 'producer' }}
    needs: prepare-producer
    uses: ./.github/workflows/_build_csrc_cache.yaml
    with:
      target: ${{ needs.prepare-producer.outputs.target }}
      csrc_hash: ${{ needs.prepare-producer.outputs.csrc_hash }}
      source_ref: ${{ github.sha }}

  prepare-source:
    if: ${{ inputs.scenario == 'source' || inputs.scenario == 'selective-a3' }}
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.device.outputs.runner }}
      image: ${{ steps.device.outputs.image }}
      soc: ${{ steps.device.outputs.soc }}
      device: ${{ steps.device.outputs.device }}
    steps:
      - name: Resolve CI source-build environment
        id: device
        env:
          DEVICE: ${{ inputs.device }}
          RUNNER_OVERRIDE: ${{ inputs.runner_override }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.scenario }}" = "selective-a3" ]; then
            DEVICE="a3"
          fi
          case "$DEVICE" in
            a2)
              runner="linux-aarch64-a2-2"
              image="swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-910b-ubuntu22.04-py3.12"
              soc="ascend910b1"
              ;;
            a3)
              runner="linux-aarch64-a3-2"
              image="swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12"
              soc="ascend910_9391"
              ;;
            310p)
              runner="linux-aarch64-310p-2"
              image="swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-310p-ubuntu22.04-py3.12"
              soc="ascend310p1"
              ;;
            a5)
              runner="linux-aarch64-a5-2"
              image="swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-950-ubuntu22.04-py3.12"
              soc="ascend950dt_9582"
              ;;
            *)
              echo "::error::unknown device $DEVICE"
              exit 1
              ;;
          esac
          if [ -n "$RUNNER_OVERRIDE" ]; then
            runner="$RUNNER_OVERRIDE"
          fi
          {
            echo "runner=$runner"
            echo "image=$image"
            echo "soc=$soc"
            echo "device=$DEVICE"
          } >> "$GITHUB_OUTPUT"

  source:
    if: ${{ inputs.scenario == 'source' || inputs.scenario == 'selective-a3' }}
    needs: prepare-source
    runs-on: ${{ needs.prepare-source.outputs.runner }}
    container:
      image: ${{ needs.prepare-source.outputs.image }}
    env:
      UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu"
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      UV_HTTP_TIMEOUT: 120
      UV_NO_CACHE: 1
      UV_SYSTEM_PYTHON: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install source-build dependencies
        run: |
          set -euo pipefail
          sed -Ei 's@(ports|archive).ubuntu.com@cache-service.nginx-pypi-cache.svc.cluster.local:8081@g' /etc/apt/sources.list
          pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local
          apt-get update -y
          apt-get install -y git zstd
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          xargs apt-get -y install < packages.txt
          apt-get -y install gcc g++ cmake libnuma-dev clang-15
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 20
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 20
          pip install -v uv
          pip install -v uc-manager
          uv pip install -v -r requirements-dev.txt
          uv pip install -v --force-reinstall --no-deps triton-ascend==3.2.2

      # Container runners in this CI fork do not expose the checkout to the
      # host-side local-action resolver. Inline the TEST-ONLY wrapper while
      # still exercising the same runs-on/cache backend as production.
      - name: Prepare isolated source L1 key
        id: source-l1
        env:
          CACHE_DIR: /tmp/vllm-ascend-incremental-build-cache
          COMPATIBILITY_ID: ci-source-${{ needs.prepare-source.outputs.device }}-${{ needs.prepare-source.outputs.image }}-${{ runner.arch }}
          DEVICE: ${{ needs.prepare-source.outputs.device }}
        run: |
          set -euo pipefail
          engine="$GITHUB_WORKSPACE/csrc/scripts/build_cache.py"

          rm -rf "$CACHE_DIR"
          mkdir -p "$CACHE_DIR"

          if [ ! -f "$engine" ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This source snapshot predates the fine-grained csrc cache; building without L1."
            exit 0
          fi
          echo "supported=true" >> "$GITHUB_OUTPUT"

          schema="$(python3 - "$engine" <<'PYCODE'
          import ast
          import sys
          from pathlib import Path

          tree = ast.parse(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "SCHEMA_VERSION":
                          print(ast.literal_eval(node.value))
                          raise SystemExit(0)
          raise SystemExit("SCHEMA_VERSION not found")
          PYCODE
          )"

          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          manifest="$(git -C "$GITHUB_WORKSPACE" ls-files -s -- csrc setup.py CMakeLists.txt cmake)"
          if [ -n "$manifest" ]; then
            csrc_hash="$(printf '%s\n' "$manifest" | sha256sum | awk '{print $1}')"
          else
            csrc_hash="adhoc"
          fi

          compatibility_id="$COMPATIBILITY_ID"
          if [ "$DEVICE" = "a5" ]; then
            # The full A5 operator set currently hits an unrelated upstream
            # chunk_gated_delta_rule_fwd_h/toolchain failure. Keep this
            # TEST-ONLY smoke snapshot isolated from the full A5 namespace.
            compatibility_id="${compatibility_id}-smoke-causal-conv1d"
          fi
          compat_digest="$(printf '%s' "$compatibility_id" | sha256sum | awk '{print $1}')"
          compat_prefix="vllm-ascend-inc-v1-schema${schema}-${compat_digest}-"
          same_csrc_prefix="${compat_prefix}${csrc_hash}-"
          primary_key="${same_csrc_prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s%N)-$$-${RANDOM}"

          {
            echo "primary-key=$primary_key"
            echo "csrc-hash=$csrc_hash"
            echo "same-csrc-prefix=$same_csrc_prefix"
            echo "compat-prefix=$compat_prefix"
          } >> "$GITHUB_OUTPUT"

          {
            echo "VLLM_ASCEND_BUILD_CACHE_DIR=$CACHE_DIR"
            echo "VLLM_ASCEND_BUILD_CACHE_EVENT_LOG=${RUNNER_TEMP}/csrc-l1-${GITHUB_JOB}.jsonl"
            echo "VLLM_ASCEND_BUILD_CACHE_ENTRY_LOCK_TIMEOUT_SECONDS=60"
            echo "VLLM_ASCEND_BUILD_CACHE_ACTION_LOCK_TIMEOUT_SECONDS=120"
            echo "VLLM_ASCEND_BUILD_CACHE_PUBLISH_LOCK_TIMEOUT_SECONDS=120"
          } >> "$GITHUB_ENV"

      - name: Restore isolated source L1
        id: source-l1-restore
        if: steps.source-l1.outputs.supported == 'true'
        continue-on-error: true
        uses: runs-on/cache/restore@v5
        with:
          path: /tmp/vllm-ascend-incremental-build-cache
          key: ${{ steps.source-l1.outputs.primary-key }}
          restore-keys: |
            ${{ steps.source-l1.outputs.same-csrc-prefix }}
            ${{ steps.source-l1.outputs.compat-prefix }}

      - name: Mutate one operator-local input
        if: inputs.scenario == 'selective-a3'
        run: |
          set -euo pipefail
          target=csrc/attention/compressor_metadata/op_kernel/compressor_metadata.cpp
          printf '\n// TEST-ONLY selective cache invalidation probe.\n' >> "$target"
          git diff --check -- "$target"
          test "$(git diff --name-only)" = "$target"
          echo "Selective invalidation input: $target"

      - name: Limit A5 smoke validation to one known-good operator
        if: needs.prepare-source.outputs.device == 'a5'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("csrc/build_aclnn.sh")
          text = path.read_text(encoding="utf-8")
          branch = 'elif [[ "$SOC_VERSION" =~ ^ascend950 ]]; then'
          branch_start = text.index(branch)
          array_start = text.index("    CUSTOM_OPS_ARRAY=(", branch_start)
          array_end = text.index("    )", array_start) + len("    )")
          replacement = '''    CUSTOM_OPS_ARRAY=(
              # TEST-ONLY A5 cache smoke probe. causal_conv1d produced valid
              # artifacts before the unrelated full-build operator failure.
              "causal_conv1d"
          )'''
          path.write_text(
              text[:array_start] + replacement + text[array_end:],
              encoding="utf-8",
          )
          PY
          grep -A5 'matched SOC branch: ascend950' csrc/build_aclnn.sh
          echo "A5 TEST-ONLY source scope: causal_conv1d"

      - name: Compile from source
        env:
          SOC_VERSION: ${{ needs.prepare-source.outputs.soc }}
          MAX_JOBS: "16"
        run: |
          set -euo pipefail
          set +u
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          if [ -f /usr/local/Ascend/nnal/atb/set_env.sh ]; then
            source /usr/local/Ascend/nnal/atb/set_env.sh
          fi
          set -u
          uv pip install -v -e .

      - name: Summarize cache telemetry
        if: always()
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          event = Path(
              os.environ.get("VLLM_ASCEND_BUILD_CACHE_EVENT_LOG", "")
          )
          if not event.is_file():
              print("cache event log missing")
              raise SystemExit(0)

          events = [
              json.loads(line)
              for line in event.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          starts = collections.Counter(
              e.get("domain")
              for e in events
              if e.get("event") == "action_start"
          )
          results = collections.Counter(
              (e.get("domain"), e.get("status"))
              for e in events
              if e.get("event") == "cache_result"
          )
          print("action_start:", dict(starts))
          print("cache_result:", dict(results))
          selective = sorted(
              (
                  e.get("domain"),
                  e.get("unit"),
                  e.get("action"),
                  e.get("status"),
              )
              for e in events
              if e.get("event") == "cache_result"
              and e.get("status") != "HIT"
          )
          print("non_hit_actions:", selective)
          print(
              "lock_timeout:",
              sum(e.get("event") == "lock_timeout" for e in events),
          )
          print(
              "index_skipped:",
              sum(e.get("event") == "index_skipped" for e in events),
          )
          PY

      - name: Inspect isolated source L1
        id: source-l1-inspect
        if: success()
        env:
          CACHE_DIR: /tmp/vllm-ascend-incremental-build-cache
          PRIMARY_KEY: ${{ steps.source-l1.outputs.primary-key }}
        run: |
          set -euo pipefail
          if [ -n "$PRIMARY_KEY" ] \
            && [ -d "$CACHE_DIR" ] \
            && find "$CACHE_DIR" -mindepth 1 -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            du -sh "$CACHE_DIR" || true
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save isolated source L1
        if: >-
          inputs.scenario != 'selective-a3' &&
          steps.source-l1-inspect.outputs.present == 'true'
        continue-on-error: true
        uses: runs-on/cache/save@v5
        with:
          path: /tmp/vllm-ascend-incremental-build-cache
          key: ${{ steps.source-l1.outputs.primary-key }}

  doctest-source:
    if: ${{ inputs.scenario == 'doctest-source' || inputs.scenario == 'doctest-diagnose' }}
    runs-on: ${{ inputs.runner_override != '' && inputs.runner_override || 'linux-aarch64-a2-2' }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-910b-ubuntu22.04-py3.12
    steps:
      - uses: actions/checkout@v7

      # Container runners in this CI fork do not expose the checkout to the
      # host-side local-action resolver. Inline the TEST-ONLY wrapper while
      # preserving the production key and runs-on/cache semantics.
      - name: Prepare isolated doctest L1 key
        id: doctest-l1
        env:
          CACHE_DIR: ${{ runner.temp }}/vllm-ascend-incremental-build-cache
          COMPATIBILITY_ID: ci-doctest-source-a2-${{ runner.arch }}
        run: |
          set -euo pipefail
          engine="$GITHUB_WORKSPACE/csrc/scripts/build_cache.py"

          rm -rf "$CACHE_DIR"
          mkdir -p "$CACHE_DIR"

          schema="$(python3 - "$engine" <<'PYCODE'
          import ast
          import sys
          from pathlib import Path

          tree = ast.parse(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "SCHEMA_VERSION":
                          print(ast.literal_eval(node.value))
                          raise SystemExit(0)
          raise SystemExit("SCHEMA_VERSION not found")
          PYCODE
          )"

          compat_digest="$(printf '%s' "$COMPATIBILITY_ID" | sha256sum | awk '{print $1}')"
          compat_prefix="vllm-ascend-inc-v1-schema${schema}-${compat_digest}-"
          same_csrc_prefix="${compat_prefix}adhoc-"
          primary_key="${same_csrc_prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s%N)-$$-${RANDOM}"

          {
            echo "primary-key=$primary_key"
            echo "same-csrc-prefix=$same_csrc_prefix"
            echo "compat-prefix=$compat_prefix"
          } >> "$GITHUB_OUTPUT"

          {
            echo "VLLM_ASCEND_BUILD_CACHE_DIR=$CACHE_DIR"
            echo "VLLM_ASCEND_BUILD_CACHE_EVENT_LOG=${RUNNER_TEMP}/csrc-l1-${GITHUB_JOB}.jsonl"
            echo "VLLM_ASCEND_BUILD_CACHE_ENTRY_LOCK_TIMEOUT_SECONDS=60"
            echo "VLLM_ASCEND_BUILD_CACHE_ACTION_LOCK_TIMEOUT_SECONDS=120"
            echo "VLLM_ASCEND_BUILD_CACHE_PUBLISH_LOCK_TIMEOUT_SECONDS=120"
          } >> "$GITHUB_ENV"

      - name: Restore isolated doctest L1
        id: doctest-l1-restore
        continue-on-error: true
        uses: runs-on/cache/restore@v5
        with:
          path: ${{ runner.temp }}/vllm-ascend-incremental-build-cache
          key: ${{ steps.doctest-l1.outputs.primary-key }}
          restore-keys: |
            ${{ steps.doctest-l1.outputs.same-csrc-prefix }}
            ${{ steps.doctest-l1.outputs.compat-prefix }}

      - name: Diagnose doctest custom cache key drift
        if: ${{ inputs.scenario == 'doctest-diagnose' }}
        env:
          CACHE_DIR: ${{ runner.temp }}/vllm-ascend-incremental-build-cache
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          cache_dir = Path(os.environ["CACHE_DIR"])
          groups = collections.defaultdict(list)
          for manifest_path in cache_dir.rglob("manifest.json"):
              try:
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              if manifest.get("domain") != "custom_operator":
                  continue
              identity = (
                  manifest.get("soc"),
                  manifest.get("operator"),
                  manifest.get("action"),
              )
              groups[identity].append(manifest)

          fields = (
              "operator_text_hash",
              "prepared_input_hash",
              "recipe_hash",
              "compiler_environment_hash",
          )
          drift = collections.Counter()
          comparable = 0
          samples = []
          prepared_input_samples = []
          for identity, manifests in sorted(groups.items()):
              if len(manifests) < 2:
                  continue
              comparable += 1
              changed = tuple(
                  field
                  for field in fields
                  if len({manifest.get(field) for manifest in manifests}) > 1
              )
              drift[changed] += 1
              if len(samples) < 8:
                  samples.append((identity, len(manifests), changed))
              if "prepared_input_hash" in changed and len(prepared_input_samples) < 3:
                  input_maps = [
                      {
                          item.get("path"): item.get("sha256", item.get("target"))
                          for item in manifest.get("prepared_inputs", [])
                      }
                      for manifest in manifests
                  ]
                  all_paths = sorted(set().union(*(mapping.keys() for mapping in input_maps)))
                  changed_paths = [
                      path
                      for path in all_paths
                      if len({mapping.get(path) for mapping in input_maps}) > 1
                  ]
                  prepared_input_samples.append(
                      (identity, len(changed_paths), changed_paths[:20])
                  )

          print("custom_manifest_groups:", len(groups))
          print("comparable_groups:", comparable)
          print("drift_signatures:", dict(drift))
          print("drift_samples:", samples)
          print("prepared_input_drift_samples:", prepared_input_samples)
          PY

      - name: Run real source-install doctest
        if: ${{ inputs.scenario == 'doctest-source' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          doc = Path(
              "docs/source/getting_started/installation/"
              "install_vllm_ascend.inc.md"
          )
          text = doc.read_text(encoding="utf-8")
          upstream_clone = (
              "git clone --depth 1 --branch {{ vllm_ascend_version }} "
              "https://github.com/vllm-project/vllm-ascend.git"
          )
          validation_source = (
              'cp -a "$GITHUB_WORKSPACE" vllm-ascend\n'
              'git config --global --add safe.directory "$PWD/vllm-ascend"'
          )
          if text.count(upstream_clone) != 1:
              raise SystemExit("unexpected source-install clone block")
          doc.write_text(
              text.replace(upstream_clone, validation_source),
              encoding="utf-8",
          )

          # The cache gate ends after the documented source installation. The
          # following offline Quick Start exercises vLLM/vLLM-Ascend runtime
          # API compatibility, which is a separate doctest concern and can
          # fail when upstream vLLM main moves ahead of this validation SHA.
          worker = Path("tests/e2e/doctests/002-installation-test.sh")
          worker_text = worker.read_text(encoding="utf-8")
          verification = (
              '  run_shell_block installation-post-standard --expand-macros\n'
              '  verify_installation_with_quickstart\n'
          )
          if worker_text.count(verification) != 1:
              raise SystemExit("unexpected installation verification block")
          worker.write_text(
              worker_text.replace(
                  verification,
                  '  echo "TEST-ONLY: source installation completed"\n',
              ),
              encoding="utf-8",
          )

          # Production doctest creates a fresh mktemp source root on every
          # run. The generated operator Python inputs embed that root, so the
          # TEST-ONLY cold/warm gate uses a deterministic runner path while
          # preserving the documented source-install commands themselves.
          worker_text = worker.read_text(encoding="utf-8")
          random_work_dir = (
              '  WORK_DIR="$(mktemp -d)"\n'
              '  trap cleanup_installation EXIT\n'
          )
          stable_work_dir = (
              '  WORK_DIR="${RUNNER_TEMP}/doctest-source-work"\n'
              '  rm -rf "${WORK_DIR}"\n'
              '  mkdir -p "${WORK_DIR}"\n'
              '  trap cleanup_installation EXIT\n'
          )
          if worker_text.count(random_work_dir) != 1:
              raise SystemExit("unexpected doctest work-dir block")
          worker.write_text(
              worker_text.replace(random_work_dir, stable_work_dir),
              encoding="utf-8",
          )
          PY
          runtime_dir="$(mktemp -d)"
          cd "$runtime_dir"
          bash "$GITHUB_WORKSPACE/tests/e2e/doctests/scripts/run_doctests.sh" \
            installation source

      - name: Summarize doctest cache telemetry
        if: ${{ always() && inputs.scenario == 'doctest-source' }}
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          event = Path(os.environ.get("VLLM_ASCEND_BUILD_CACHE_EVENT_LOG", ""))
          if not event.is_file():
              print("cache event log missing")
              raise SystemExit(0)
          events = [
              json.loads(line)
              for line in event.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          starts = collections.Counter(
              e.get("domain") for e in events if e.get("event") == "action_start"
          )
          results = collections.Counter(
              (e.get("domain"), e.get("status"))
              for e in events
              if e.get("event") == "cache_result"
          )
          print("action_start:", dict(starts))
          print("cache_result:", dict(results))
          print("lock_timeout:", sum(e.get("event") == "lock_timeout" for e in events))
          print("index_skipped:", sum(e.get("event") == "index_skipped" for e in events))
          PY

      - name: Inspect isolated doctest L1
        id: doctest-l1-inspect
        if: ${{ success() && inputs.scenario == 'doctest-source' }}
        env:
          CACHE_DIR: ${{ runner.temp }}/vllm-ascend-incremental-build-cache
          PRIMARY_KEY: ${{ steps.doctest-l1.outputs.primary-key }}
        run: |
          set -euo pipefail
          if [ -n "$PRIMARY_KEY" ] \
            && [ -d "$CACHE_DIR" ] \
            && find "$CACHE_DIR" -mindepth 1 -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            du -sh "$CACHE_DIR" || true
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save isolated doctest L1
        if: ${{ inputs.scenario == 'doctest-source' && steps.doctest-l1-inspect.outputs.present == 'true' }}
        continue-on-error: true
        uses: runs-on/cache/save@v5
        with:
          path: ${{ runner.temp }}/vllm-ascend-incremental-build-cache
          key: ${{ steps.doctest-l1.outputs.primary-key }}

  doctest-root-diff:
    if: ${{ inputs.scenario == 'doctest-root-diff' }}
    # TEST-ONLY: generation does not require an NPU. Keep this diagnosis on the
    # Docker-capable ARM CPU pool and avoid consuming an A2 source-build runner.
    runs-on: ${{ inputs.runner_override != '' && inputs.runner_override || 'linux-arm64-cpu-16' }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-910b-ubuntu22.04-py3.12
    steps:
      - uses: actions/checkout@v7
      - name: Generate and compare prepared input under two roots
        run: |
          set -euo pipefail
          set +u
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          if [ -f /usr/local/Ascend/nnal/atb/set_env.sh ]; then
            source /usr/local/Ascend/nnal/atb/set_env.sh
          fi
          set -u

          samples="$RUNNER_TEMP/doctest-root-diff"
          rm -rf "$samples"
          mkdir -p "$samples"

          for label in a b; do
            source_root="$RUNNER_TEMP/root-diff-${label}/source/vllm-ascend"
            binary_root="$RUNNER_TEMP/root-diff-${label}/build"
            rm -rf "$(dirname "$source_root")" "$binary_root"
            mkdir -p "$(dirname "$source_root")"
            cp -a "$GITHUB_WORKSPACE" "$source_root"
            git config --global --add safe.directory "$source_root"

            cmake -S "$source_root/csrc" -B "$binary_root" \
              -DASCEND_COMPUTE_UNIT=ascend910b \
              -DASCEND_OP_NAME=add_rms_norm_bias \
              -DENABLE_CCACHE=OFF
            cmake --build "$binary_root" \
              --target generate_transformer_adapt_py --parallel 4

            generated="$binary_root/impl/dynamic/add_rms_norm_bias.py"
            test -f "$generated"
            cp "$generated" "$samples/AddRmsNormBias-${label}.py"
            printf '%s\n' "$source_root" > "$samples/source-root-${label}.txt"
            printf '%s\n' "$binary_root" > "$samples/binary-root-${label}.txt"
          done

          python3 - <<'PY'
          import hashlib
          import itertools
          import os
          from pathlib import Path

          samples = Path(os.environ["RUNNER_TEMP"]) / "doctest-root-diff"
          a = samples.joinpath("AddRmsNormBias-a.py").read_text(encoding="utf-8")
          b = samples.joinpath("AddRmsNormBias-b.py").read_text(encoding="utf-8")
          source_a = samples.joinpath("source-root-a.txt").read_text().strip()
          source_b = samples.joinpath("source-root-b.txt").read_text().strip()
          binary_a = samples.joinpath("binary-root-a.txt").read_text().strip()
          binary_b = samples.joinpath("binary-root-b.txt").read_text().strip()

          def sha(text):
              return hashlib.sha256(text.encode("utf-8")).hexdigest()

          normalize_a = a.replace(source_a, "<SOURCE_ROOT>").replace(
              binary_a, "<BINARY_ROOT>"
          )
          normalize_b = b.replace(source_b, "<SOURCE_ROOT>").replace(
              binary_b, "<BINARY_ROOT>"
          )
          for path in (
              os.environ.get("ASCEND_HOME_PATH", ""),
              os.environ.get("ASCEND_TOOLKIT_HOME", ""),
          ):
              if path:
                  normalize_a = normalize_a.replace(path, "<ASCEND_ROOT>")
                  normalize_b = normalize_b.replace(path, "<ASCEND_ROOT>")

          print("source_root_a:", source_a)
          print("source_root_b:", source_b)
          print("binary_root_a:", binary_a)
          print("binary_root_b:", binary_b)
          print("raw_sha_a:", sha(a))
          print("raw_sha_b:", sha(b))
          print("normalized_sha_a:", sha(normalize_a))
          print("normalized_sha_b:", sha(normalize_b))
          print("normalized_equal:", normalize_a == normalize_b)
          print("limited_differing_lines:")
          differences = 0
          for line_no, (left, right) in enumerate(
              itertools.zip_longest(a.splitlines(), b.splitlines()),
              start=1,
          ):
              if left == right:
                  continue
              differences += 1
              if differences <= 80:
                  print(f"line {line_no} A: {left[:500]!r}")
                  print(f"line {line_no} B: {right[:500]!r}")
          print("differing_line_positions:", differences)

          print("lines_containing_explicit_roots:")
          roots = (source_a, source_b, binary_a, binary_b)
          shown = 0
          for label, text in (("A", a), ("B", b)):
              for line_no, line in enumerate(text.splitlines(), start=1):
                  if any(root and root in line for root in roots):
                      print(f"{label}:{line_no}: {line[:500]}")
                      shown += 1
                      if shown >= 40:
                          break
              if shown >= 40:
                  break
          print("root_line_samples:", shown)
          PY

  wheel-a2:
    if: ${{ inputs.scenario == 'wheel-a2' }}
    runs-on: ${{ inputs.runner_override != '' && inputs.runner_override || 'linux-aarch64-a2-2' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore isolated wheel L1
        id: wheel-l1
        uses: ./.github/actions/csrc-l1-restore
        with:
          cache-dir: ${{ github.workspace }}/build_cache
          compatibility-id: ci-wheel-a2-arm64-py312

      - name: Build A2 wheel image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/dockerfiles/Dockerfile.buildwheel.a2")
          text = source.read_text(encoding="utf-8")
          marker = "# Install vllm-ascend\n"
          if text.count(marker) != 1:
              raise SystemExit("unexpected wheel Dockerfile install marker")
          Path("/tmp/Dockerfile.buildwheel.a2").write_text(
              text.replace(
                  marker,
                  marker
                  + "ENV VLLM_ASCEND_BUILD_CACHE_EVENT_LOG="
                  + "/tmp/csrc-l1-wheel.jsonl\n",
              ),
              encoding="utf-8",
          )
          PY
          docker build \
            -f /tmp/Dockerfile.buildwheel.a2 \
            --build-arg PY_VERSION=3.12 \
            -t wheel-ci-validation:v1 .

      - name: Export updated wheel L1
        run: |
          set -euo pipefail
          .github/workflows/scripts/export_csrc_l1_from_image.sh \
            wheel-ci-validation:v1 \
            "$GITHUB_WORKSPACE/build_cache" \
            /workspace/vllm-ascend/build_cache

          container_id="$(docker create wheel-ci-validation:v1)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp \
            "$container_id:/tmp/csrc-l1-wheel.jsonl" \
            "$RUNNER_TEMP/csrc-l1-wheel.jsonl"
          python3 - "$RUNNER_TEMP/csrc-l1-wheel.jsonl" <<'PY'
          import collections
          import json
          import sys
          from pathlib import Path

          events = [
              json.loads(line)
              for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          starts = collections.Counter(
              e.get("domain") for e in events if e.get("event") == "action_start"
          )
          results = collections.Counter(
              (e.get("domain"), e.get("status"))
              for e in events
              if e.get("event") == "cache_result"
          )
          print("action_start:", dict(starts))
          print("cache_result:", dict(results))
          print("lock_timeout:", sum(e.get("event") == "lock_timeout" for e in events))
          print("index_skipped:", sum(e.get("event") == "index_skipped" for e in events))
          PY

      - name: Save isolated wheel L1
        uses: ./.github/actions/csrc-l1-save
        with:
          cache-dir: ${{ github.workspace }}/build_cache
          primary-key: ${{ steps.wheel-l1.outputs.primary-key }}

  image-a2:
    if: ${{ inputs.scenario == 'image-a2' }}
    runs-on: ${{ inputs.runner_override != '' && inputs.runner_override || 'linux-aarch64-a2-2' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore isolated image-build L1
        id: image-l1
        uses: ./.github/actions/csrc-l1-restore
        with:
          cache-dir: ${{ github.workspace }}/build_cache
          compatibility-id: ci-image-a2-arm64-910b

      - name: Build real A2 Docker image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("Dockerfile")
          text = source.read_text(encoding="utf-8")
          marker = 'ARG COMPILE_CUSTOM_KERNELS=1\n'
          if text.count(marker) != 1:
              raise SystemExit("unexpected image Dockerfile compile marker")
          Path("/tmp/Dockerfile.image-a2").write_text(
              text.replace(
                  marker,
                  marker
                  + "ENV VLLM_ASCEND_BUILD_CACHE_EVENT_LOG="
                  + "/tmp/csrc-l1-image.jsonl\n",
              ),
              encoding="utf-8",
          )
          PY
          docker build \
            --build-arg COMPILE_CUSTOM_KERNELS=1 \
            -t vllm-ascend-image-ci-validation:v1 \
            -f /tmp/Dockerfile.image-a2 .

      - name: Export updated image-build L1
        run: |
          set -euo pipefail
          .github/workflows/scripts/export_csrc_l1_from_image.sh \
            vllm-ascend-image-ci-validation:v1 \
            "$GITHUB_WORKSPACE/build_cache" \
            /vllm-workspace/vllm-ascend/build_cache

          container_id="$(docker create vllm-ascend-image-ci-validation:v1)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp \
            "$container_id:/tmp/csrc-l1-image.jsonl" \
            "$RUNNER_TEMP/csrc-l1-image.jsonl"
          python3 - "$RUNNER_TEMP/csrc-l1-image.jsonl" <<'PY'
          import collections
          import json
          import sys
          from pathlib import Path

          events = [
              json.loads(line)
              for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          starts = collections.Counter(
              e.get("domain") for e in events if e.get("event") == "action_start"
          )
          results = collections.Counter(
              (e.get("domain"), e.get("status"))
              for e in events
              if e.get("event") == "cache_result"
          )
          print("action_start:", dict(starts))
          print("cache_result:", dict(results))
          print("lock_timeout:", sum(e.get("event") == "lock_timeout" for e in events))
          print("index_skipped:", sum(e.get("event") == "index_skipped" for e in events))
          PY

      - name: Save isolated image-build L1
        uses: ./.github/actions/csrc-l1-save
        with:
          cache-dir: ${{ github.workspace }}/build_cache
          primary-key: ${{ steps.image-l1.outputs.primary-key }}
