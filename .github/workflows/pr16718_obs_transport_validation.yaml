# TEST-ONLY: isolated OBS round-trip for PR #16718.
name: PR16718 OBS transport validation

on:
  push:
    branches:
      - test/pr16718-review-fix

permissions:
  contents: read

env:
  # TEST-ONLY transport owned by the CI fork. Production keeps its existing
  # ascend-ci-cache-hk / ap-southeast-1 contract.
  TEST_OBS_BUCKET: obs-guiiyang1-ascend-test
  TEST_OBS_ENDPOINT: https://obs.cn-southwest-2.myhuaweicloud.com
  TEST_OBS_REGION: cn-southwest-2

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OBS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OBS_SECRET_KEY }}
    outputs:
      primary-key: ${{ steps.restore.outputs.primary-key }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Confirm existing OBS writer authorization
        run: test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"

      - name: Select CI-fork OBS transport
        run: |
          set -euo pipefail
          for action in \
            .github/actions/csrc-l1-restore/action.yaml \
            .github/actions/csrc-l1-save/action.yaml; do
            sed -i \
              -e "s/ascend-ci-cache-hk/${TEST_OBS_BUCKET}/g" \
              -e "s#https://obs.ap-southeast-1.myhuaweicloud.com#${TEST_OBS_ENDPOINT}#g" \
              -e "s/ap-southeast-1/${TEST_OBS_REGION}/g" \
              "$action"
            grep -F "RUNS_ON_S3_BUCKET_CACHE: ${TEST_OBS_BUCKET}" "$action"
            grep -F "RUNS_ON_S3_BUCKET_ENDPOINT: ${TEST_OBS_ENDPOINT}" "$action"
            grep -F "AWS_REGION: ${TEST_OBS_REGION}" "$action"
          done

      - name: Restore isolated L1 namespace
        id: restore
        uses: ./.github/actions/csrc-l1-restore
        with:
          cache-dir: ${{ runner.temp }}/pr16718-obs-cache
          architecture: x64
          soc-version: a2
          toolchain-image: validation.invalid/pr16718-obs:cbf1bd66b
          source-root: .
          csrc-hash: pr16718-obs-transport-cbf1bd66b

      - name: Add isolated validation entry
        env:
          CACHE_DIR: ${{ runner.temp }}/pr16718-obs-cache
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_DIR"
          printf '%s\n' 'formal-production-sha=cbf1bd66b021aa247eec4b34d2143943bb07dcfa' > "$CACHE_DIR/validation-sentinel"
          touch "$CACHE_DIR/.updated"

      - name: Save isolated L1 namespace
        uses: ./.github/actions/csrc-l1-save
        with:
          cache-dir: ${{ runner.temp }}/pr16718-obs-cache
          primary-key: ${{ steps.restore.outputs.primary-key }}
          access-key-id: ${{ secrets.OBS_ACCESS_KEY }}
          secret-access-key: ${{ secrets.OBS_SECRET_KEY }}

  consumer:
    needs: producer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OBS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OBS_SECRET_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Select CI-fork OBS transport
        run: |
          set -euo pipefail
          sed -i \
            -e "s/ascend-ci-cache-hk/${TEST_OBS_BUCKET}/g" \
            -e "s#https://obs.ap-southeast-1.myhuaweicloud.com#${TEST_OBS_ENDPOINT}#g" \
            -e "s/ap-southeast-1/${TEST_OBS_REGION}/g" \
            .github/actions/csrc-l1-restore/action.yaml
          grep -F "RUNS_ON_S3_BUCKET_CACHE: ${TEST_OBS_BUCKET}" \
            .github/actions/csrc-l1-restore/action.yaml
          grep -F "RUNS_ON_S3_BUCKET_ENDPOINT: ${TEST_OBS_ENDPOINT}" \
            .github/actions/csrc-l1-restore/action.yaml
          grep -F "AWS_REGION: ${TEST_OBS_REGION}" \
            .github/actions/csrc-l1-restore/action.yaml

      - name: Restore isolated L1 namespace
        id: restore
        uses: ./.github/actions/csrc-l1-restore
        with:
          cache-dir: ${{ runner.temp }}/pr16718-obs-cache
          architecture: x64
          soc-version: a2
          toolchain-image: validation.invalid/pr16718-obs:cbf1bd66b
          source-root: .
          csrc-hash: pr16718-obs-transport-cbf1bd66b

      - name: Verify independent OBS restore
        env:
          CACHE_DIR: ${{ runner.temp }}/pr16718-obs-cache
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$MATCHED_KEY"
          grep -Fx 'formal-production-sha=cbf1bd66b021aa247eec4b34d2143943bb07dcfa' "$CACHE_DIR/validation-sentinel"
          test ! -e "$CACHE_DIR/.updated"
